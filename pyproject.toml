[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inceoglu-2017-reproduction"
version = "0.1.0"
description = "Python reproduction of Inceoglu et al. (2017), Astronomy & Astrophysics"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Fadil Inceoglu"}]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
